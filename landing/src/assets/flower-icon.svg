<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Mimoza adaptive icon foreground">
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD95A" stop-opacity=".97"/>
      <stop offset="1" stop-color="#E3A722" stop-opacity=".78"/>
    </linearGradient>
    <radialGradient id="center" cx="38%" cy="32%" r="72%">
      <stop stop-color="#FFF6DC"/>
      <stop offset="1" stop-color="#F1D892"/>
    </radialGradient>
    <g id="ring">
      <ellipse cy="-178" rx="125" ry="160"/>
      <ellipse cy="-178" rx="125" ry="160" transform="rotate(60)"/>
      <ellipse cy="-178" rx="125" ry="160" transform="rotate(120)"/>
      <ellipse cy="-178" rx="125" ry="160" transform="rotate(180)"/>
      <ellipse cy="-178" rx="125" ry="160" transform="rotate(240)"/>
      <ellipse cy="-178" rx="125" ry="160" transform="rotate(300)"/>
    </g>
  </defs>

  <!-- 0.66: launchers crop to the middle 72 of 108dp, so this puts the bloom at
       the same share of the visible shape as on the iOS tile. Filling the
       safe zone instead makes it look oversized next to other apps. -->
  <g transform="translate(512 512) scale(0.66)">
    <g fill="url(#petal)"><use href="#ring"/></g>
    <circle r="98" fill="url(#center)"/>
  </g>
</svg>

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.syncedkeystore'
version = '0.1.0'

android {
  namespace "expo.modules.syncedkeystore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Version pinned here on purpose — Play Services artifacts rev often,
  // and npm run fingerprint:* is what catches a drift going unnoticed.
  implementation "com.google.android.gms:play-services-auth-blockstore:16.4.0"
}

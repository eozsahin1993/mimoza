<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Mimoza notification icon">
  <!-- Android draws this canvas at 15dp in the status bar and 16dp inside the
       card's icon circle, padding included, so the bloom fills it nearly edge
       to edge. Only alpha survives: one solid fill, no translucency. -->
  <g transform="translate(512 512) scale(1.38)" fill="#FFFFFF">
    <ellipse cy="-178" rx="125" ry="160"/>
    <ellipse cy="-178" rx="125" ry="160" transform="rotate(60)"/>
    <ellipse cy="-178" rx="125" ry="160" transform="rotate(120)"/>
    <ellipse cy="-178" rx="125" ry="160" transform="rotate(180)"/>
    <ellipse cy="-178" rx="125" ry="160" transform="rotate(240)"/>
    <ellipse cy="-178" rx="125" ry="160" transform="rotate(300)"/>
    <circle r="98"/>
  </g>
</svg>

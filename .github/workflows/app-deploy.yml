name: Deploy App

# Staging follows main, the same as the relay. Production is a tag, the
# same as the relay's server-v*. Both land in App Store Connect; only
# production is ever submitted from there.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-deploy.yml']
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      force:
        description: Build natively even when only the JS changed
        type: choice
        default: none
        options: [none, ios, android, both]

jobs:
  # Resolved once: a tag is a release, anything else is staging. Every job
  # below reads this rather than repeating the branch test.
  context:
    name: Which environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      channel: ${{ steps.pick.outputs.channel }}
      eas-environment: ${{ steps.pick.outputs.eas-environment }}
    steps:
      - id: pick
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "channel=production" >> "$GITHUB_OUTPUT"
            echo "eas-environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "channel=staging" >> "$GITHUB_OUTPUT"
            echo "eas-environment=preview" >> "$GITHUB_OUTPUT"
          fi

  # Cheap and on Ubuntu, so a failing test costs a minute rather than the
  # fifteen a macOS archive takes — and nothing reaches App Store Connect
  # that couldn't pass on a pull request. The relay gates its deploy the
  # same way, on Server Tests.
  test:
    name: Lint and test
    needs: context
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npx jest --ci

  # What decides build vs update. The fingerprint hashes everything that
  # affects the native build, so an unchanged one means the installed
  # binaries can run this JS and only an update is needed. Per platform:
  # an Android-only native change leaves iOS alone.
  fingerprint:
    name: Native change?
    needs: [context, test]
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    defaults:
      run:
        working-directory: app
    outputs:
      build-ios: ${{ steps.check.outputs.build-ios }}
      build-android: ${{ steps.check.outputs.build-android }}
      ios-fingerprint: ${{ steps.check.outputs.ios-fingerprint }}
      android-fingerprint: ${{ steps.check.outputs.android-fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # The fingerprint depends on the resolved app config, so it needs the
      # same environment the build would get.
      - id: check
        run: ../.github/scripts/decide-build.sh
        env:
          FORCE: ${{ inputs.force || 'none' }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/app-v') }}
          APP_ENV: ${{ secrets.APP_ENV }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EAS_PROJECT_OWNER: ${{ secrets.EAS_PROJECT_OWNER }}
          EXPO_PUBLIC_RELAY_URL: ${{ secrets.EXPO_PUBLIC_RELAY_URL }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}

  android:
    name: Android to App Distribution
    needs: [context, test, fingerprint]
    if: needs.fingerprint.outputs.build-android == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    concurrency:
      group: ship-android-${{ startsWith(github.ref, 'refs/tags/app-v') && 'production' || 'staging' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Pinned because it is load-bearing: Android Studio's bundled 17.0.6
      # crashes this build with a JIT internal error on aarch64, and a
      # runner otherwise takes whatever it defaults to.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: app
          bundler-cache: true

      - run: npm ci

      # The lane wants a path; a secret holds contents.
      - name: Write the service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase.json"
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Ship
        run: bundle exec fastlane android ${{ needs.context.outputs.environment }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ runner.temp }}/firebase.json
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # The keystore lives in the certificates repo, read the same way
          # match reads it.
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_ENV: ${{ secrets.APP_ENV }}
          EXPO_PUBLIC_RELAY_URL: ${{ secrets.EXPO_PUBLIC_RELAY_URL }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}

  ios:
    name: iOS to TestFlight
    needs: [context, test, fingerprint]
    if: needs.fingerprint.outputs.build-ios == 'true'
    runs-on: macos-latest
    environment: ${{ needs.context.outputs.environment }}
    # Two at once would claim the same build number, and the second upload
    # is rejected after ten minutes of work.
    concurrency:
      group: ship-app-${{ startsWith(github.ref, 'refs/tags/app-v') && 'production' || 'staging' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Pinned rather than whatever macos-latest defaults to, which lags and
      # changes without notice. Shell rather than an action: this job holds
      # the signing secrets, and selecting a preinstalled Xcode is one line.
      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: app
          bundler-cache: true

      - run: npm ci

      - name: Ship
        run: bundle exec fastlane ios ${{ needs.context.outputs.environment }}
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          # SSH won't work on a runner, so match reads the certificates repo
          # over HTTPS with a token.
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: true
          # There is no .env file here — both are gitignored — but dotenv
          # tolerates a missing one and never overrides what is already set.
          APP_ENV: ${{ secrets.APP_ENV }}
          APNS_PRODUCTION: ${{ secrets.APNS_PRODUCTION }}
          EXPO_PUBLIC_RELAY_URL: ${{ secrets.EXPO_PUBLIC_RELAY_URL }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: app/build/logs
          if-no-files-found: ignore
          retention-days: 7

  update:
    name: Publish the JS
    needs: [context, test, fingerprint]
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Unsigned: end-to-end code signing is gated behind EAS Production or
      # Enterprise, so the protection it buys — Expo itself being unable to
      # tamper with an update — is not on the table at this size. The token
      # is therefore the only thing standing between a compromise and
      # arbitrary JS on a device, which is worth remembering when deciding
      # who may hold it.
      - name: Publish
        run: |
          npx eas-cli@latest update \
            --channel "${{ needs.context.outputs.channel }}" \
            --message "$(git log -1 --pretty=%s)" \
            --environment "${{ needs.context.outputs.eas-environment }}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ENV: ${{ secrets.APP_ENV }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EAS_PROJECT_OWNER: ${{ secrets.EAS_PROJECT_OWNER }}
          EXPO_PUBLIC_RELAY_URL: ${{ secrets.EXPO_PUBLIC_RELAY_URL }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}

  # Records what the binaries were built from, so the next push can tell
  # whether its JS fits them. Outside app/, so committing it does not
  # re-trigger this workflow. Only after both platforms settle: a record
  # claiming a build that failed would suppress the retry.
  record:
    name: Record the shipped fingerprints
    needs: [fingerprint, ios, android]
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - run: >
          .github/scripts/record-fingerprints.sh
          "${{ needs.fingerprint.outputs.ios-fingerprint }}"
          "${{ needs.fingerprint.outputs.android-fingerprint }}"

name: App Unit Tests

on:
  push:
    branches: [main]
    # Includes this workflow itself, so a change to it is validated by
    # the run it defines rather than waiting for the next app/ commit.
    paths: ['app/**', '.github/workflows/app-unit-test.yml']
  pull_request:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-unit-test.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Run tests
        run: npx jest --ci
